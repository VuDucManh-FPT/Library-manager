<div class="row ">
    <div class="col-sm-12">
        <div class="card">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card-header d-flex justify-content-between">
                <div class="header-title">
                    <h4 class="card-title">Staff List</h4>
                </div>
                <div class="d-flex gap-2 p-3">
                    <a class="btn btn-primary" th:href="@{/admin/staff/register}" role="button">Add</a>
                </div>
            </div>
            <div class="card-body">
                <div class="custom-table-effect table-responsive custom-table-search user-table">
                    <table class=" mb-0 table table-bordered" id="datatable" data-toggle="data-table1">
                        <thead class="">
                        <tr class="bg-white">
                            <th scope="col" class="border-bottom bg-primary text-white">Profile</th>
                            <th scope="col" class="border-bottom bg-primary text-white">Name </th>
                            <th scope="col" class="border-bottom bg-primary text-white">Contact</th>
                            <th scope="col" class="border-bottom bg-primary text-white">Email</th>
                            <th scope="col" class="border-bottom bg-primary text-white">Role</th>
                            <th scope="col" class="border-bottom bg-primary text-white">IsActive</th>
                            <th scope="col" class="border-bottom bg-primary text-white">Ban</th>
                            <th scope="col" class="border-bottom bg-primary text-white">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="staff : ${staffs}">
                            <td><img th:src="@{'/static/BookSto/assets/images/avatars/' + ${staff.avatar}}"
                                     class="rounded img-fluid avatar-40" alt=""></td>
                            <td th:text="${staff.staffName}"></td>
                            <td th:text="${staff.phoneNumber}"></td>
                            <td th:text="${staff.staffEmail}"></td>
                            <td th:text="${staff.role.roleName}"></td>
                            <!-- Checkbox cho trạng thái Active -->
                            <td>
                                <input type="checkbox" id="activeSwitch_${staff.id}" class="checkboxs"
                                       th:checked="${staff.active == true}"
                                       data-staff-id="${staff.id}"
                                       disabled>
                                <label for="activeSwitch_${staff.id}" class="toggles text-white bg-primary border-primary">
                                    <p class="texts ps-1">
                                        &nbsp;&nbsp;
                                    </p>
                                </label>
                            </td>
                            <td>
                                <input type="checkbox" id="banSwitch_${staff.id}" class="checkboxs"
                                       th:checked="${staff.isban == true}"
                                       data-staff-id="${staff.id}"
                                       disabled>
                                <label for="banSwitch_${staff.id}" class="toggles text-white bg-primary border-primary">
                                    <p class="texts ps-1">
                                        &nbsp;&nbsp;
                                    </p>
                                </label>
                            </td>
                            <td>
                                <div class="d-flex gap-2 align-items-center">
                                    <a class="btn btn-warning-subtle px-1 py-1 rounded d-flex"
                                       data-toggle="tooltip" data-placement="top" title="Edit"
                                       th:href="@{/admin/staff/update/{id}(id=${staff.staffId})}">
                                        <i class="ph ph-pencil-simple"></i>
                                    </a>
                                    <a class="btn btn-danger-subtle px-1 py-1 rounded d-flex"
                                       data-toggle="tooltip" data-placement="top" title="Ban" th:href="@{/admin/staff/ban/{id}(id=${staff.staffId})}"
                                       onclick="return confirm('Are you sure you want to ban this staff member?');">
                                        <i class="ion ion-close-circled"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
