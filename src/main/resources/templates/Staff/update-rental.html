<div class="row">

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center position-relative">
                <div class="iq-header-title">
                    <h4 class="mb-0">Update borrow</h4>
                </div>
            </div>
            <div class="card-body">
                <form th:action="@{/staff/update-rental/{id}(id=${borrowIndex.borrowIndexId})}" method="POST">
                    <div class="form-group">
                        <label for="staffName">Staff Name:</label>
                        <input type="text" id="staffName" name="staffName" th:value="${borrowIndex.staff.staffName}" class="form-control p-2 bg-white border" disabled>
                        <input type="hidden" id="staffID" name="staffID" th:value="${borrowIndex.staff.staffId}">
                    </div>
                    <div class="form-group">
                        <label for="studentID">Student:</label>
                        <select id="studentID" name="studentID" class="select2-basic-single" required>
                            <th:block th:each="student : ${studentList}">
                                <option th:value="${student.studentId}"
                                        th:text="${student.studentEmail}"
                                        th:selected="${student.studentId == borrowIndex.student.studentId}">
                                </option>
                            </th:block>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bookID">Book:</label>
                        <select id="bookID" name="bookID" class="select2-basic-single" required>
                            <th:block th:each="book : ${bookList}">
                                <option th:value="${book.bookId}"
                                        th:text="${book.bookName}"
                                        th:selected="${book.bookId == borrowIndex.book.bookId}">
                                </option>
                            </th:block>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="conditionBeforeID">Condition Before:</label>
                        <select id="conditionBeforeID" name="conditionBeforeID" class="select2-basic-single" required>
                            <th:block th:each="bookCondition : ${bookConditionList}">
                                <option th:value="${bookCondition.bookConditionId}"
                                        th:text="${bookCondition.detail}"
                                        th:selected="${bookCondition.bookConditionId == borrowIndex.conditionBefore.bookConditionId}">
                                </option>
                            </th:block>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="estimateDate">Estimate Date:</label>
                        <input type="date" id="estimateDate" name="estimateDate" th:value="${#dates.format(borrowIndex.estimateDate, 'yyyy-MM-dd')}" class="form-control p-2 bg-white border" required>
                    </div>
                    <div class="form-group">
                        <label for="startDate">Start Date:</label>
                        <input type="date" id="startDate" name="startDate" th:value="${#dates.format(borrowIndex.startDate, 'yyyy-MM-dd')}" class="form-control p-2 bg-white border" onchange="updateEstimateDate()" required>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/staff/rentals}"  class="btn btn-danger">Back</a>
                        <a th:href="@{/staff/delete-rental/{id}(id=${borrowIndex.borrowIndexId})}"  class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this borrow index?');">Delete</a>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>

    <script>
        (function() {
            "use strict";

            // Khởi tạo Select2 cho lựa chọn đơn sinh viên
            $("#studentID").select2({
                width: '100%',                     // Đảm bảo Select2 chiếm toàn bộ chiều rộng
                placeholder: 'Select a student',   // Placeholder cho dropdown
                allowClear: true                   // Cho phép người dùng xóa lựa chọn
            });

            // Gắn thêm class 'wide' cho Select2 của sinh viên
            $('#studentID').next('.select2-container').addClass('wide');
        })();
        function updateEstimateDate() {
            const startDateInput = document.getElementById('startDate');
            const estimateDateInput = document.getElementById('estimateDate');

            // Lấy ngày bắt đầu
            const startDate = new Date(startDateInput.value);

            // Kiểm tra nếu ngày bắt đầu hợp lệ
            if (!isNaN(startDate.getTime())) {
                // Tính toán ngày ước tính (thêm 7 ngày)
                const estimateDate = new Date(startDate);
                estimateDate.setDate(startDate.getDate() + 7);

                // Đặt giá trị cho trường estimateDate
                estimateDateInput.value = estimateDate.toISOString().split('T')[0]; // Chỉ lấy phần ngày
            } else {
                // Nếu không có ngày hợp lệ, đặt lại estimateDate
                estimateDateInput.value = '';
            }
        }
    </script>
