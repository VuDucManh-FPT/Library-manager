<!-- loader Start -->
<div id="loading">
    <div class="loader simple-loader">
        <div class="loader-body">
            <img src="../static/images/loader.gif" alt="loader" class="light-loader img-fluid " width="200">
        </div>

<aside class="sidebar sidebar-base " id="first-tour" data-toggle="main-sidebar"
       data-sidebar="responsive">

</aside><main class="main-content">
    <div class="position-sticky top-0 z-3">
        <!--Nav Start-->
        <div th:insert="fragments/navbarStudent :: navbarStudent"></div>
        <!--Nav End-->
    </div>
    <div class="content-inner container-fluid pb-0" id="page_layout">
        <div class="row ">
            <div class="col-sm-12">
                <div class="card">
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div class="card-header d-flex justify-content-between align-items-center position-relative">
                        <div class="iq-header-title">
                            <h4 class="mb-0">History</h4>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="custom-table-effect table-responsive custom-table-search ">
                            <table class=" mb-0 table table-bordered custom-datatable-border" id="datatable"
                                   data-toggle="data-table">
                                <thead class="">
                                <tr class="bg-white">
                                    <th scope="col" class="border-bottom bg-primary text-white">Book</th>
                                    <th scope="col" class="border-bottom bg-primary text-white custom-column-width">Start Date</th>
                                    <th scope="col" class="border-bottom bg-primary text-white">Estimate Date</th>
                                    <th scope="col" class="border-bottom bg-primary text-white">Return Date</th>
                                    <th scope="col" class="border-bottom bg-primary text-white">Fine</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="loanRecord : ${loanHistory}">
                                    <td th:text="${loanRecord.borrowIndex.book.getBookName()}"></td>
                                    <td th:text="${loanRecord.borrowIndex.getStartDate()}"></td>
                                    <td th:text="${loanRecord.borrowIndex.getEstimateDate()}"></td>
                                    <td th:text="${loanRecord.borrowIndex.getReturnDate()}"></td>
                                    <td>
                                      <span th:if="${loanRecord.borrowIndex.fines != null and !loanRecord.borrowIndex.fines.isEmpty()}">
                                       <span th:text="${loanRecord.borrowIndex.fines[0].value}"></span>
                                        </span>
                                        <a th:if="${loanRecord.borrowIndex.fines != null and !loanRecord.borrowIndex.fines.isEmpty() and loanRecord.borrowIndex.fines[0].status == 'Unpaid'}"
                                           th:href="${loanRecord.paymentUrl}"
                                           class="btn btn-primary btn-sm">Pay Fine</a>
                                        <span th:if="${loanRecord.borrowIndex.fines == null or loanRecord.borrowIndex.fines.isEmpty()}">No fine</span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <!-- Footer Section Start -->
